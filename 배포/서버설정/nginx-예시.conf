# 위생점검 체크리스트 웹앱 — nginx 설정 예시 (방법 ② 사내 서버)
# 이 파일은 웹 폴더에 올리지 말고 서버 설정에 반영하세요. 경로·도메인·인증서는 환경에 맞게 바꿉니다.

server {
    listen 80;
    server_name hygiene.example.local;          # ← 실제 주소
    return 301 https://$host$request_uri;       # 카메라·오프라인 동작은 https 에서만 됨
}

server {
    listen 443 ssl;
    server_name hygiene.example.local;          # ← 실제 주소
    ssl_certificate     /etc/ssl/certs/site.crt;   # ← 실제 인증서
    ssl_certificate_key /etc/ssl/private/site.key;

    # 하위 경로에 둘 때 예: location /hygiene-checklist/ { alias /var/www/hygiene-checklist/; ... }
    root  /var/www/hygiene-checklist;           # ← 배포 묶음(dist) 을 푼 폴더
    index index.html;
    autoindex off;

    types {
        text/html  html;
        text/css   css;
        text/javascript js;
        application/json json;
        application/manifest+json webmanifest;
        image/png  png;
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
    }
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # 오프라인 동작 파일·첫 화면은 늘 최신으로 확인
    # (nginx 는 location 안에 add_header 가 있으면 위쪽 헤더를 물려받지 않으므로 보안 헤더를 다시 적음)
    location ~ ^/(sw\.js|index\.html)?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
